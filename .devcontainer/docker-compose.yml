volumes:
  postgres-data:

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:5-24-trixie

    volumes:
      - ..:/workspaces/bookorbit:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Use proper Docker networking instead of network_mode: service:db
    # to ensure reliable DNS resolution in all environments
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-bookorbit}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-bookorbit}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-bookorbit}
      POSTGRES_HOST_AUTH_METHOD: trust

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

networks:
  app-network:
    driver: bridge
